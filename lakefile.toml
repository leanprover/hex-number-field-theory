name = "hex-number-field-theory"
defaultTargets = ["HexNumberFieldTheory"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexMatrixTheory"
git = "https://github.com/leanprover/hex-matrix-theory.git"
rev = "v0.10.0"

[[require]]
name = "HexPolyTheory"
git = "https://github.com/leanprover/hex-poly-theory.git"
rev = "v0.10.0"

[[require]]
name = "HexPolyZTheory"
git = "https://github.com/leanprover/hex-poly-z-theory.git"
rev = "v0.10.0"

[[require]]
name = "HexRootsTheory"
git = "https://github.com/leanprover/hex-roots-theory.git"
rev = "v0.10.0"

[[require]]
name = "HexBerlekampZassenhausTheory"
git = "https://github.com/leanprover/hex-berlekamp-zassenhaus-theory.git"
rev = "v0.10.0"

[[require]]
name = "HexResultantTheory"
git = "https://github.com/leanprover/hex-resultant-theory.git"
rev = "v0.10.0"

[[require]]
name = "HexNumberField"
git = "https://github.com/leanprover/hex-number-field.git"
rev = "v0.10.0"

[[require]]
name = "batteries"
git = "https://github.com/leanprover-community/batteries"
rev = "main"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "6b7abb3c7686292736be2955bd3eb9ebf63b456a"

[[lean_lib]]
name = "HexNumberFieldTheory"
